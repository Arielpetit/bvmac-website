# AWS Amplify build settings for the BVMAC website (Next.js 16, server-rendered).
# Amplify does not pass environment variables to the running server, so the build copies the ones
# the site needs into .env.production. Node 20.9 or later is required by Next.js 16.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci --no-audit --no-fund
    build:
      commands:
        - env | grep -E '^(NEXT_PUBLIC_|SUPABASE_|GROQ_|SITE_URL|GATE_)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

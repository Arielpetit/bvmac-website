<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#7a4f12;text-decoration:none}a:hover{color:#5a3412}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.sec{margin:20px 24px 8px;font-size:11.5px;letter-spacing:0.12em;text-transform:uppercase;color:#8a7f72;font-weight:500}
.n{display:flex;gap:12px;align-items:flex-start;margin:0 20px 8px;padding:14px;border-radius:18px;color:#1a140e}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#fbf9f5;font-family:'Geist',system-ui,sans-serif;color:#1a140e">

  <header style="padding:54px 20px 0;display:flex;align-items:center;gap:10px">
    <a href="Main.dc.html" aria-label="Retour" style="width:42px;height:42px;border-radius:50%;border:1px solid #e8e0d0;background:#fff;color:#1a140e;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 class="serif" style="margin:0;font-size:24px;font-weight:500;flex:1">Notifications</h1>
    <a href="Notifications.dc.html" aria-label="Réglages des notifications" style="width:42px;height:42px;border-radius:50%;border:1px solid #e8e0d0;background:#fff;color:#1a140e;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></a>
  </header>

  <div style="margin:12px 20px 0;display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:13px;color:#6b6155">{{unreadLabel}}</span>
    <button onClick="{{markAll}}" style="border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:#7a4f12;cursor:pointer;padding:6px 0">Tout marquer comme lu</button>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <div class="sec">{{g.label}}</div>
    <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
      <a class="n" href="{{it.href}}" style="{{it.box}}">
        <span class="ico" style="{{it.icoStyle}}"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.icon}}"></path></svg></span>
        <span style="flex:1;min-width:0">
          <span style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:14px;{{it.titleStyle}}">{{it.title}}</span><span style="font-size:11.5px;color:#8a7f72;white-space:nowrap">{{it.time}}</span></span>
          <span style="display:block;font-size:12.5px;color:#6b6155;margin-top:3px;line-height:1.4">{{it.body}}</span>
        </span>
        <sc-if value="{{it.unread}}" hint-placeholder-val="{{false}}"><span aria-label="Non lu" style="width:8px;height:8px;border-radius:50%;background:#c9a23a;margin-top:6px;flex-shrink:0"></span></sc-if>
      </a>
    </sc-for>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { read: false };
  }
  renderVals() {
    const read = this.state.read;
    const gold = 'background:#f4e9c8;color:#8a6614;';
    const dark = 'background:#1c130b;color:#ead18a;';
    const mk = (it) => {
      const unread = it.unread && !read;
      return {
        ...it, unread,
        box: unread ? 'background:#fff;border:1px solid #ead18a;' : 'background:transparent;border:1px solid transparent;',
        titleStyle: unread ? 'font-weight:600;' : 'font-weight:500;'
      };
    };
    const groups = [
      { label: 'Aujourd’hui', items: [
        { title: 'BOC du 8 octobre publié', body: 'Cours, volumes et capitalisation de la séance.', time: '18:05', href: 'Avis.dc.html', icon: 'M14 3H6v18h12V7zM14 3v4h4', icoStyle: dark, unread: true },
        { title: 'BGFI HC proche de votre seuil', body: '89 000 FCFA · seuil fixé à 90 000 FCFA.', time: '18:05', href: 'Valeur.dc.html', icon: 'M3 3v18h18M7 15l4-4 3 3 5-6', icoStyle: gold, unread: true }
      ].map(mk) },
      { label: 'Cette semaine', items: [
        { title: 'Rappel · AG de SCG-Ré', body: 'Assemblée générale ordinaire le 22 octobre.', time: 'Lun.', href: 'Agenda.dc.html', icon: 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4', icoStyle: gold, unread: false },
        { title: 'Série de 4 jours', body: 'Une leçon de 5 min pour la garder.', time: 'Dim.', href: 'Lecon.dc.html', icon: 'M22 10 12 5 2 10l10 5 10-5zM6 12v5c3 2 9 2 12 0v-5', icoStyle: gold, unread: false },
        { title: 'Communiqué · RENAPROV', body: 'Communiqué officiel – RENAPROV Finance S.A.', time: '1 oct.', href: 'AvisDetail.dc.html', icon: 'M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4', icoStyle: gold, unread: false }
      ].map(mk) }
    ];
    const n = read ? 0 : 2;
    return {
      groups,
      unreadLabel: n ? n + ' non lues' : 'Tout est lu',
      markAll: () => this.setState({ read: true })
    };
  }
}
</script>
</body>
</html>

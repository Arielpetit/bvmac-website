<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Informations personnelles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#7a4f12;text-decoration:none}a:hover{color:#5a3412}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12.5px;color:#6b6155}
.in{height:50px;padding:0 16px;border-radius:14px;border:1px solid #e8e0d0;background:#fff;font:inherit;font-size:15px;color:#1a140e;outline:0;box-sizing:border-box;width:100%}
</style>
</helmet>
<div style="width:100%;height:100vh;height:100dvh;position:relative;overflow:hidden;background:#fbf9f5;font-family:'Geist',system-ui,sans-serif;color:#1a140e">

  <header style="padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0;display:flex;align-items:center;gap:12px">
    <a href="Moi.dc.html" aria-label="Retour" style="width:42px;height:42px;border-radius:50%;border:1px solid #e8e0d0;background:#fff;color:#1a140e;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 class="serif" style="margin:0;font-size:21px;font-weight:500">Informations personnelles</h1>
  </header>

  <div style="margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:10px">
    <span style="width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#ead18a,#c9a23a);color:#1c130b;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-size:30px;position:relative">AK
      <span style="position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:#1c130b;color:#fbf6ea;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fbf9f5"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
    </span>
    <button onClick="{{photo}}" style="border:0;background:transparent;font:inherit;font-size:13.5px;color:#7a4f12;cursor:pointer;padding:6px">Changer la photo</button>
  </div>

  <form style="padding:6px 20px 0;display:flex;flex-direction:column;gap:14px">
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <div class="f"><label for="pn">Prénom</label><input id="pn" class="in" value="Aminata"></div>
      <div class="f"><label for="nm">Nom</label><input id="nm" class="in" value="Kamga"></div>
    </div>
    <div class="f"><label for="tel">Téléphone</label>
      <div style="position:relative"><input id="tel" class="in" value="+237 6•• •• •• 41" readonly style="padding-right:96px;color:#6b6155"><span style="position:absolute;right:12px;top:14px;font-size:11px;font-weight:600;color:#157a43;background:#e4f3ea;padding:3px 9px;border-radius:999px">Vérifié</span></div>
    </div>
    <div class="f"><label for="em">E-mail</label><input id="em" class="in" type="email" placeholder="vous@exemple.com"></div>
    <div class="f"><label for="py">Pays de résidence</label>
      <div style="position:relative"><select id="py" class="in" style="appearance:none;padding-right:40px"><option>Cameroun</option><option>Centrafrique</option><option>Congo</option><option>Gabon</option><option>Guinée équatoriale</option><option>Tchad</option></select>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;right:16px;top:17px;pointer-events:none"><path d="m6 9 6 6 6-6"></path></svg></div>
    </div>
  </form>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 30px;background:#fbf9f5">
    <button onClick="{{save}}" style="width:100%;height:54px;border-radius:999px;border:0;background:#1c130b;color:#fbf6ea;font:inherit;font-size:15px;font-weight:600;cursor:pointer">Enregistrer</button>
    <button onClick="{{askDelete}}" style="width:100%;margin-top:8px;height:40px;border:0;background:transparent;font:inherit;font-size:13px;color:#a3263a;cursor:pointer">Supprimer mon compte et mes données</button>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position:absolute;left:20px;right:20px;bottom:150px;z-index:5;display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;background:#1c130b;color:#fbf6ea;font-size:13.5px;box-shadow:0 16px 40px -12px rgba(28,19,11,0.55)"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ead18a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"></path></svg>{{toast}}</div>
  </sc-if>

  <sc-if value="{{confirm}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;inset:0;z-index:10;background:rgba(18,12,6,0.55);display:flex;align-items:flex-end">
      <div role="alertdialog" aria-modal="true" aria-labelledby="del-t" style="width:100%;background:#fbf9f5;border-radius:28px 28px 0 0;padding:12px 24px 34px;box-sizing:border-box">
        <div style="width:40px;height:5px;border-radius:999px;background:#d9cdb6;margin:0 auto 18px"></div>
        <span style="width:52px;height:52px;border-radius:16px;background:#fbe7ea;color:#c0263d;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></span>
        <h2 id="del-t" class="serif" style="margin:16px 0 0;font-size:22px;font-weight:500">Supprimer votre compte ?</h2>
        <p style="margin:8px 0 0;font-size:14px;line-height:1.55;color:#6b6155">Vos favoris, alertes et progression à l’École seront effacés sous 30 jours, conformément à la loi n°2024/017. Votre compte-titres auprès de la société de bourse n’est pas concerné.</p>
        <a href="Bienvenue.dc.html" style="margin-top:20px;height:52px;border-radius:999px;background:#c0263d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600">Supprimer définitivement</a>
        <button onClick="{{cancel}}" style="width:100%;margin-top:8px;height:48px;border:0;background:transparent;font:inherit;font-size:15px;color:#1a140e;cursor:pointer">Annuler</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { confirm: false, toast: null };
  }
  toast(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: null }), 2500);
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    return {
      toast: this.state.toast,
      confirm: this.state.confirm,
      photo: () => this.toast('Photo de profil mise à jour'),
      save: () => this.toast('Modifications enregistrées'),
      askDelete: () => this.setState({ confirm: true }),
      cancel: () => this.setState({ confirm: false })
    };
  }
}
</script>
</body>
</html>

const fr=document.getElementById('fr'),ph=document.getElementById('ph');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{fr.src=b.dataset.f;mark(b.dataset.f)});
function mark(f){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.f===f))}
fr.onload=()=>{try{mark(fr.contentWindow.location.pathname.split('/').pop())}catch(e){}};
function fit(){const s=Math.min(1,(innerHeight-60)/844);ph.style.transform='scale('+s+')'}

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Mes favoris</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#7a4f12;text-decoration:none}a:hover{color:#5a3412}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.num{font-variant-numeric:tabular-nums}
.sec{margin:20px 24px 8px;font-size:11.5px;letter-spacing:0.12em;text-transform:uppercase;color:#8a7f72;font-weight:500;display:flex;justify-content:space-between}
.box{margin:0 20px;background:#fff;border:1px solid #e8e0d0;border-radius:20px;padding:0 14px}
.fav{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #efe8da;color:#1a140e}
.fav:last-child{border-bottom:0}
.logo{width:40px;height:40px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid #efe8da;flex-shrink:0}
.rm{width:30px;height:30px;border-radius:50%;border:0;background:#fbe7ea;color:#c0263d;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.flag{width:22px;height:15px;border-radius:3px;overflow:hidden;display:inline-flex;flex-shrink:0}
.flag span{flex:1}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#fbf9f5;font-family:'Geist',system-ui,sans-serif;color:#1a140e">

  <header style="padding:54px 20px 0;display:flex;align-items:center;gap:12px">
    <a href="Main.dc.html" aria-label="Retour" style="width:42px;height:42px;border-radius:50%;border:1px solid #e8e0d0;background:#fff;color:#1a140e;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 class="serif" style="margin:0;font-size:24px;font-weight:500;flex:1">Mes favoris</h1>
    <button onClick="{{toggleEdit}}" aria-pressed="{{editAria}}" style="height:38px;padding:0 16px;border-radius:999px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;{{editStyle}}">{{editLabel}}</button>
  </header>

  <p style="margin:10px 20px 0;font-size:13px;color:#6b6155">{{countLabel}} · cours de clôture du 8 oct. 2026</p>

  <div class="sec"><span>Actions</span><span>Cours · var.</span></div>
  <div class="box">
    <sc-for list="{{stocks}}" as="s" hint-placeholder-count="3">
      <div class="fav">
        <sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
          <button class="rm" aria-label="{{s.rmLabel}}" onClick="{{s.remove}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
        </sc-if>
        <img class="logo" src="{{s.logo}}" alt="">
        <a href="Valeur.dc.html" style="flex:1;min-width:0;color:#1a140e"><span style="display:block;font-weight:600;font-size:14.5px">{{s.name}}</span><span style="display:block;font-size:12px;color:#6b6155">{{s.sector}}</span></a>
        <svg aria-hidden="true" width="52" height="20" viewBox="0 0 56 20"><polyline points="{{s.spark}}" fill="none" stroke="{{s.color}}" stroke-width="1.5"></polyline></svg>
        <span style="text-align:right;width:70px"><span class="num" style="display:block;font-weight:600;font-size:14.5px">{{s.price}}</span><span class="num" style="display:block;font-size:11.5px;color:#6b6155">0,00 %</span></span>
      </div>
    </sc-for>
  </div>

  <div class="sec"><span>Obligations</span><span>Cours · échéance</span></div>
  <div class="box">
    <div class="fav">
      <span class="flag" aria-hidden="true"><span style="background:#009e60"></span><span style="background:#fcd116"></span><span style="background:#3a75c4"></span></span>
      <a href="Obligations.dc.html" style="flex:1;min-width:0;color:#1a140e"><span style="display:block;font-weight:600;font-size:14.5px">EOG.15 24/27</span><span style="display:block;font-size:12px;color:#6b6155">État du Gabon</span></a>
      <span style="text-align:right"><span class="num" style="display:block;font-weight:600;font-size:14.5px">97,00 %</span><span style="display:block;font-size:11.5px;color:#6b6155">2027</span></span>
    </div>
  </div>

  <a href="Marches.dc.html" style="margin:14px 20px 0;height:52px;border-radius:18px;border:1.5px dashed #d9cdb6;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;color:#7a4f12">
    <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Ajouter une valeur</a>

  <div style="margin:14px 20px 0;padding:12px 14px;border-radius:16px;background:#f4efe5;display:flex;gap:10px;align-items:center;font-size:12.5px;color:#3f362c">
    <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8a6614" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21h4"></path></svg>
    <span style="flex:1">Vous recevez les avis publiés sur vos favoris.</span>
    <a href="Notifications.dc.html" style="font-weight:500">Régler</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { editing: false, removed: {} };
  }
  renderVals() {
    const all = [
      { id: 'bgfi', name: 'BGFI HC', sector: 'Banque', price: '89 000', logo: './assets/dad075d0e86d2f40aa8c230910e920ed.png', spark: '0,8 8,10 14,6 22,12 30,9 38,13 46,11 56,15', color: '#a8925f' },
      { id: 'socapalm', name: 'SOCAPALM', sector: 'Agro-industrie', price: '49 500', logo: './assets/d99733952378c2f0b677faef5b0f9f3a.png', spark: '0,15 8,13 14,14 22,8 30,10 38,6 46,7 56,5', color: '#157a43' },
      { id: 'safacam', name: 'SAFACAM', sector: 'Agro-industrie', price: '38 500', logo: './assets/5d754d569f2a9eb85783b50b38e4ff00.png', spark: '0,6 8,9 14,7 22,12 30,10 38,14 46,12 56,13', color: '#a8925f' },
      { id: 'scg', name: 'SCG-Ré', sector: 'Réassurance', price: '20 000', logo: './assets/7ef65fcd5636225925680793a7130b18.png', spark: '0,10 8,8 14,12 22,9 30,11 38,8 46,10 56,9', color: '#a8925f' }
    ];
    const { editing, removed } = this.state;
    const stocks = all.filter((s) => !removed[s.id]).map((s) => ({
      ...s,
      rmLabel: 'Retirer ' + s.name + ' des favoris',
      remove: () => this.setState({ removed: { ...this.state.removed, [s.id]: true } })
    }));
    const n = stocks.length + 1;
    return {
      stocks, editing,
      countLabel: n + ' valeur' + (n > 1 ? 's' : '') + ' suivie' + (n > 1 ? 's' : ''),
      editAria: editing ? 'true' : 'false',
      editLabel: editing ? 'Terminé' : 'Modifier',
      editStyle: editing ? 'border:0;background:#1c130b;color:#fbf6ea;' : 'border:1px solid #e8e0d0;background:#fff;color:#1a140e;',
      toggleEdit: () => this.setState({ editing: !this.state.editing })
    };
  }
}
</script>
</body>
</html>

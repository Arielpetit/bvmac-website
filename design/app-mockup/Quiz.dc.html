<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Quiz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#7a4f12;text-decoration:none}a:hover{color:#5a3412}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.opt{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px;border-radius:18px;font:inherit;font-size:14.5px;line-height:1.35;cursor:pointer;color:#1a140e}
.letter{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
</style>
</helmet>
<div style="width:100%;height:100vh;height:100dvh;position:relative;overflow:hidden;background:#fbf9f5;font-family:'Geist',system-ui,sans-serif;color:#1a140e">

  <header style="padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0;display:flex;align-items:center;gap:14px">
    <a href="Ecole.dc.html" aria-label="Quitter le quiz" style="width:42px;height:42px;border-radius:50%;border:1px solid #e8e0d0;background:#fff;color:#1a140e;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <div style="flex:1">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#6b6155"><span>Lire le BOC</span><span>Question 3 / 5</span></div>
      <div style="margin-top:6px;height:6px;border-radius:999px;background:#efe8da;overflow:hidden"><div style="width:60%;height:100%;background:linear-gradient(90deg,#8a6614,#c9a23a)"></div></div>
    </div>
  </header>

  <section style="padding:30px 20px 0">
    <span style="display:inline-block;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#8a6614;font-weight:600;background:#f4e9c8;padding:4px 10px;border-radius:999px">Quiz</span>
    <h1 class="serif" style="margin:14px 0 0;font-size:25px;font-weight:500;line-height:1.25">Dans le BOC, que représente le « cours de référence » d’une action ?</h1>
  </section>

  <div role="radiogroup" aria-label="Réponses" style="padding:22px 20px 0;display:flex;flex-direction:column;gap:10px">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
      <button class="opt" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="{{o.style}}">
        <span class="letter" style="{{o.letterStyle}}">{{o.letter}}</span>
        <span style="flex:1">{{o.text}}</span>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{showFeedback}}" hint-placeholder-val="{{false}}">
    <div style="margin:16px 20px 0;padding:14px 16px;border-radius:18px;{{feedbackStyle}}">
      <div style="font-weight:600;font-size:14px">{{feedbackTitle}}</div>
      <div style="font-size:13px;line-height:1.5;margin-top:4px;color:#3f362c">Le cours de référence est le cours de clôture de la séance précédente. La variation du jour se calcule par rapport à lui.</div>
    </div>
  </sc-if>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:16px 20px 34px;background:linear-gradient(180deg,rgba(251,249,245,0),#fbf9f5 30%)">
    <sc-if value="{{showFeedback}}" hint-placeholder-val="{{false}}">
      <a href="Bravo.dc.html" style="height:54px;border-radius:999px;background:#c9a23a;color:#1c130b;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600">Terminer la leçon
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    </sc-if>
    <sc-if value="{{notChecked}}" hint-placeholder-val="{{true}}">
      <button onClick="{{check}}" aria-disabled="{{disabled}}" style="width:100%;height:54px;border-radius:999px;border:0;font:inherit;font-size:15px;font-weight:600;cursor:pointer;{{ctaStyle}}">Vérifier</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null, checked: false };
  }
  renderVals() {
    const answers = [
      'Le cours de clôture de la séance précédente',
      'Le prix maximum autorisé pendant la séance',
      'La valeur nominale de l’action',
      'Le prix fixé par la société de bourse'
    ];
    const correct = 0;
    const { picked, checked } = this.state;
    const options = answers.map((text, i) => {
      let style = 'background:#fff;border:1px solid #e8e0d0;';
      let letterStyle = 'background:#f4efe5;color:#6b6155;';
      if (i === picked && !checked) { style = 'background:#fff;border:2px solid #1c130b;padding:14px 15px;'; letterStyle = 'background:#1c130b;color:#fbf6ea;'; }
      if (checked && i === correct) { style = 'background:#e4f3ea;border:2px solid #157a43;padding:14px 15px;'; letterStyle = 'background:#157a43;color:#fff;'; }
      if (checked && i === picked && i !== correct) { style = 'background:#fbe7ea;border:2px solid #c0263d;padding:14px 15px;'; letterStyle = 'background:#c0263d;color:#fff;'; }
      return {
        text, letter: 'ABCD'[i], style, letterStyle,
        checked: i === picked ? 'true' : 'false',
        pick: () => { if (!this.state.checked) this.setState({ picked: i }); }
      };
    });
    const right = picked === correct;
    return {
      options,
      showFeedback: checked,
      feedbackTitle: right ? 'Bonne réponse · +10 XP' : 'Pas tout à fait',
      feedbackStyle: right ? 'background:#e4f3ea;color:#0f5c32;' : 'background:#fbe7ea;color:#8f1c2e;',
      notChecked: !checked,
      disabled: picked === null ? 'true' : 'false',
      ctaStyle: picked === null ? 'background:#e8e0d0;color:#8a7f72;' : 'background:#1c130b;color:#fbf6ea;',
      check: () => { if (picked !== null) this.setState({ checked: true }); }
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Sociétés de bourse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#7a4f12;text-decoration:none}a:hover{color:#5a3412}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.chip{height:32px;padding:0 12px;border-radius:999px;font:inherit;font-size:12.5px;white-space:nowrap;cursor:pointer}
.sdb{margin:0 20px 10px;padding:14px 16px;background:#fff;border-radius:20px}
.svc{font-size:11px;padding:3px 9px;border-radius:999px;background:#f4efe5;color:#6b6155}
.pick{height:38px;padding:0 16px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
</style>
</helmet>
<div style="width:100%;height:100vh;height:100dvh;position:relative;overflow:hidden;background:#fbf9f5;font-family:'Geist',system-ui,sans-serif;color:#1a140e">
 <div data-lenis-prevent style="position:absolute;top:0;left:0;right:0;bottom:100px;overflow-y:auto;padding-bottom:16px">

  <header style="padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0;display:flex;align-items:center;gap:12px">
    <a href="Compte.dc.html" aria-label="Retour" style="width:42px;height:42px;border-radius:50%;border:1px solid #e8e0d0;background:#fff;color:#1a140e;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <div style="flex:1"><div style="font-size:11.5px;color:#8a6614;font-weight:600;letter-spacing:0.08em;text-transform:uppercase">Étape 3 sur 4</div><h1 class="serif" style="margin:2px 0 0;font-size:22px;font-weight:500">Choisir une société de bourse</h1></div>
  </header>

  <p style="margin:12px 20px 0;font-size:13.5px;color:#6b6155;line-height:1.5">25 intermédiaires agréés par la COSUMAF. Ils reçoivent vos ordres et tiennent votre compte-titres.</p>

  <div role="group" aria-label="Filtrer par pays" style="margin:14px 20px 14px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
      <button class="chip" aria-pressed="{{c.aria}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
    </sc-for>
  </div>

  <sc-for list="{{list}}" as="s" hint-placeholder-count="4">
    <div class="sdb" style="{{s.box}}">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1"><div style="font-size:15px;font-weight:600">{{s.name}}</div><div style="font-size:12.5px;color:#6b6155;margin-top:2px">{{s.city}}</div></div>
        <button class="pick" aria-pressed="{{s.aria}}" onClick="{{s.pick}}" style="{{s.btn}}">{{s.btnLabel}}</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><sc-for list="{{s.svcs}}" as="v" hint-placeholder-count="2"><span class="svc">{{v}}</span></sc-for></div>
    </div>
  </sc-for>
 </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 30px;background:#fff;border-top:1px solid #e8e0d0">
    <a href="CompteSignature.dc.html" style="height:54px;border-radius:999px;background:#1c130b;color:#fbf6ea;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600">Continuer avec {{chosen}}
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'edc', country: '' };
  }
  renderVals() {
    const all = [
      { id: 'edc', name: 'EDC Investment Corporation', short: 'EDC Investment', city: 'Douala · Akwa', country: 'Cameroun', svcs: ['Négociation', 'Placement', 'Tenue de compte'] },
      { id: 'bgfi', name: 'BGFI Bourse', short: 'BGFI Bourse', city: 'Libreville', country: 'Gabon', svcs: ['Négociation', 'Conseil'] },
      { id: 'financia', name: 'Financia Capital', short: 'Financia Capital', city: 'Douala · Bonanjo', country: 'Cameroun', svcs: ['Négociation', 'Placement'] },
      { id: 'lcb', name: 'LCB Capital', short: 'LCB Capital', city: 'Brazzaville', country: 'Congo', svcs: ['Négociation', 'Placement', 'Conseil'] }
    ];
    const { sel, country } = this.state;
    const opts = [['', 'Tous · 25'], ['Cameroun', 'Cameroun · 19'], ['Congo', 'Congo · 3'], ['Gabon', 'Gabon · 1']];
    return {
      chosen: all.find((s) => s.id === sel).short,
      list: all.filter((s) => !country || s.country === country).map((s) => {
        const on = s.id === sel;
        return {
          ...s,
          aria: on ? 'true' : 'false',
          box: on ? 'border:2px solid #1c130b;padding:13px 15px;' : 'border:1px solid #e8e0d0;',
          btn: on ? 'border:0;background:#e4f3ea;color:#157a43;' : 'border:1px solid #d9cdb6;background:#fff;color:#1a140e;',
          btnLabel: on ? 'Choisie' : 'Choisir',
          pick: () => this.setState({ sel: s.id })
        };
      }),
      chips: opts.map(([v, label]) => ({
        label,
        aria: v === country ? 'true' : 'false',
        style: v === country ? 'border:1px solid #1c130b;background:#1c130b;color:#fbf6ea;' : 'border:1px solid #e8e0d0;background:#fff;color:#1a140e;',
        pick: () => this.setState({ country: v })
      }))
    };
  }
}
</script>
</body>
</html>

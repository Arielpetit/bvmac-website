<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Bienvenue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#ead18a;text-decoration:none}a:hover{color:#fbf6ea}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.015em}
.lang{height:30px;padding:0 11px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#120c06;font-family:'Geist',system-ui,sans-serif;color:#efe6d4">
  <div aria-hidden="true" style="position:absolute;right:-120px;top:-120px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,58,0.32),rgba(201,162,58,0) 68%)"></div>
  <div aria-hidden="true" style="position:absolute;left:-140px;bottom:120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,58,0.14),rgba(201,162,58,0) 70%)"></div>

  <div role="group" aria-label="Langue" style="position:absolute;top:56px;right:20px;display:flex;gap:6px">
    <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
      <button class="lang" aria-pressed="{{l.aria}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.code}}</button>
    </sc-for>
  </div>

  <section style="position:relative;padding:150px 28px 0">
    <img src="./assets/4821813fde8f9178dd300928139609f5.png" alt="BVMAC" style="width:76px;height:76px">
    <h1 class="serif" style="margin:26px 0 0;font-size:36px;line-height:1.08;font-weight:500;color:#fbf6ea">La bourse de l’Afrique centrale, <span style="font-style:italic;color:#ead18a">dans votre poche.</span></h1>
    <p style="margin:14px 0 0;font-size:15px;line-height:1.55;color:rgba(239,230,212,0.72)">Cours officiels, avis du marché, alertes et une école pour apprendre à investir — dans les six pays de la CEMAC.</p>
  </section>

  <form style="position:absolute;left:0;right:0;bottom:0;padding:0 24px 40px">
    <label for="tel" style="display:block;font-size:13px;color:rgba(239,230,212,0.7);margin-bottom:8px">Votre numéro de téléphone</label>
    <div style="display:flex;gap:8px">
      <button type="button" aria-label="{{countryLabel}}" onClick="{{nextCountry}}" style="height:54px;padding:0 12px;border-radius:16px;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.06);color:#fbf6ea;font:inherit;font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer;min-width:96px">
        <span aria-hidden="true" style="display:inline-flex;width:20px;height:14px;border-radius:2px;overflow:hidden"><span style="flex:1;background:{{c1}}"></span><span style="flex:1;background:{{c2}}"></span><span style="flex:1;background:{{c3}}"></span></span>{{dial}}
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <input id="tel" type="tel" inputmode="tel" placeholder="6 90 00 00 00" style="flex:1;min-width:0;height:54px;padding:0 16px;border-radius:16px;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.06);color:#fbf6ea;font:inherit;font-size:16px;outline:0">
    </div>
    <a href="OTP.dc.html" style="margin-top:14px;height:56px;border-radius:999px;background:#c9a23a;color:#1c130b;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15.5px;font-weight:600">Recevoir mon code
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <a href="Main.dc.html" style="margin-top:8px;height:48px;display:flex;align-items:center;justify-content:center;font-size:14.5px;color:#efe6d4">Explorer sans compte</a>
    <p style="margin:8px 0 0;text-align:center;font-size:11.5px;line-height:1.5;color:rgba(239,230,212,0.5)">En continuant, vous acceptez les <a href="APropos.dc.html" style="text-decoration:underline">conditions d’utilisation</a> et la <a href="APropos.dc.html" style="text-decoration:underline">politique de confidentialité</a>.</p>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'FR', c: 0 };
  }
  renderVals() {
    const countries = [
      { name: 'Cameroun', dial: '+237', f: ['#007a5e', '#ce1126', '#fcd116'] },
      { name: 'Centrafrique', dial: '+236', f: ['#003082', '#ffffff', '#289728'] },
      { name: 'Congo', dial: '+242', f: ['#009543', '#fbde4a', '#dc241f'] },
      { name: 'Gabon', dial: '+241', f: ['#009e60', '#fcd116', '#3a75c4'] },
      { name: 'Guinée équatoriale', dial: '+240', f: ['#3e9a00', '#ffffff', '#e32118'] },
      { name: 'Tchad', dial: '+235', f: ['#002664', '#fecb00', '#c60c30'] }
    ];
    const c = countries[this.state.c];
    return {
      dial: c.dial, c1: c.f[0], c2: c.f[1], c3: c.f[2],
      countryLabel: 'Pays : ' + c.name + ', changer',
      nextCountry: () => this.setState({ c: (this.state.c + 1) % countries.length }),
      langs: ['FR', 'EN', 'ES'].map((code) => {
        const on = code === this.state.lang;
        return {
          code,
          aria: on ? 'true' : 'false',
          style: on ? 'border:0;background:#c9a23a;color:#1c130b;font-weight:600;' : 'border:1px solid rgba(255,255,255,0.18);background:transparent;color:#efe6d4;',
          pick: () => this.setState({ lang: code })
        };
      })
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Relevés et avis d’opéré</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#7a4f12;text-decoration:none}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.num{font-variant-numeric:tabular-nums}
.chip{height:36px;padding:0 14px;border-radius:999px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid #efe8da}
.row:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dl{width:36px;height:36px;border-radius:50%;border:1px solid #e8e0d0;background:#fff;color:#7a4f12;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
</style>
</helmet>
<div style="width:100%;height:100vh;height:100dvh;position:relative;overflow:hidden;background:#fbf9f5;font-family:'Geist',system-ui,sans-serif;color:#1a140e">
 <div data-lenis-prevent style="position:absolute;inset:0;overflow-y:auto;padding-bottom:30px">
  <header style="padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0;display:flex;align-items:center;gap:12px">
    <a href="Portefeuille.dc.html" aria-label="Retour" style="width:42px;height:42px;border-radius:50%;border:1px solid #e8e0d0;background:#fff;color:#1a140e;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 class="serif" style="margin:0;font-size:22px;font-weight:500">Relevés et documents</h1>
  </header>

  <div role="tablist" aria-label="Type de document" style="margin:16px 0 0;padding:0 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button class="chip" role="tab" aria-selected="{{f.sel}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button></sc-for>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <h2 style="margin:20px 24px 8px;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#8a6614">{{g.title}}</h2>
    <div style="margin:0 20px;background:#fff;border:1px solid #e8e0d0;border-radius:20px">
      <sc-for list="{{g.items}}" as="d" hint-placeholder-count="3">
        <div class="row">
          <a href="Document.dc.html" style="flex:1;display:flex;align-items:center;gap:12px;color:#1a140e;min-width:0">
            <span class="ico" style="{{d.icoStyle}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{d.icon}}"></path></svg></span>
            <span style="min-width:0"><span style="display:block;font-size:14px;font-weight:500">{{d.title}}</span><span class="num" style="display:block;font-size:12px;color:#6b6155;margin-top:1px">{{d.sub}}</span></span>
          </a>
          <button class="dl" aria-label="{{d.dlLabel}}" onClick="{{d.dl}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button>
        </div>
      </sc-for>
    </div>
  </sc-for>

  <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
    <p style="margin:40px 24px;text-align:center;font-size:14px;color:#6b6155">Aucun document de ce type pour le moment.</p>
  </sc-if>

  <p style="margin:20px 24px 0;font-size:12px;line-height:1.5;color:#8a7f72;text-align:center">Documents émis par EDC Investment, votre société de bourse. Conservez-les pour votre déclaration fiscale.</p>
 </div>
 <sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div role="status" style="position:absolute;left:20px;right:20px;bottom:34px;z-index:5;display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;background:#1c130b;color:#fbf6ea;font-size:13.5px;box-shadow:0 16px 40px -12px rgba(28,19,11,0.55)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ead18a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"></path></svg>{{toast}}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', toast: null };
  }
  toast(msg) { this.setState({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: null }), 2500); }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const types = {
      releve: { icon: 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6', ico: 'background:#f4efe5;color:#8a6614' },
      avis: { icon: 'M4 7h16M4 12h10M4 17h7M17 15l2 2 4-4', ico: 'background:#e4f3ea;color:#157a43' },
      div: { icon: 'M12 3v18M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6', ico: 'background:#f4e9c8;color:#8a6614' },
      fisc: { icon: 'M4 21V5l3 2 3-2 3 2 3-2 3 2 1-.7V21M8 11h8M8 15h5', ico: 'background:#efe8da;color:#6b6155' }
    };
    const docs = [
      ['Octobre 2026', 'avis', 'Avis d’opéré · Achat 10 BGFI HC', '08/10/2026 · 900 680 FCFA'],
      ['Octobre 2026', 'releve', 'Relevé de compte · septembre', '01/10/2026 · PDF 184 Ko'],
      ['Septembre 2026', 'avis', 'Avis d’opéré · Souscription RENAPROV', '22/09/2026 · 210 000 FCFA'],
      ['Septembre 2026', 'div', 'Avis de dividende · SOCAPALM', '15/09/2026 · 23 250 FCFA'],
      ['Septembre 2026', 'releve', 'Relevé de compte · août', '01/09/2026 · PDF 171 Ko'],
      ['2025', 'fisc', 'Imprimé fiscal unique 2025', '31/03/2026 · PDF 96 Ko']
    ];
    const f = this.state.filter;
    const list = docs.filter((d) => f === 'all' || d[1] === f);
    const groups = [];
    list.forEach(([g, type, title, sub]) => {
      let grp = groups.find((x) => x.title === g);
      if (!grp) { grp = { title: g, items: [] }; groups.push(grp); }
      grp.items.push({
        title, sub, icon: types[type].icon, icoStyle: types[type].ico,
        dlLabel: 'Télécharger ' + title,
        dl: () => this.toast('« ' + title + ' » téléchargé')
      });
    });
    return {
      toast: this.state.toast,
      groups, empty: list.length === 0,
      filters: [['all', 'Tous'], ['avis', 'Avis d’opéré'], ['releve', 'Relevés'], ['div', 'Dividendes'], ['fisc', 'Fiscal']].map(([k, label]) => ({
        label, sel: f === k ? 'true' : 'false',
        style: f === k ? 'border:1px solid #1c130b;background:#1c130b;color:#fbf6ea;font-weight:500' : 'border:1px solid #e8e0d0;background:#fff;color:#1a140e',
        pick: () => this.setState({ filter: k })
      }))
    };
  }
}
</script>
</body>
</html>

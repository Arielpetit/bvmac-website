<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Fiche BGFI HC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#7a4f12;text-decoration:none}a:hover{color:#5a3412}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.num{font-variant-numeric:tabular-nums}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid #e8e0d0;background:#fff;color:#1a140e;display:flex;align-items:center;justify-content:center;cursor:pointer}
.stat{background:#fff;border:1px solid #e8e0d0;border-radius:16px;padding:12px 14px}
.stat dt{font-size:11.5px;color:#6b6155}
.stat dd{margin:4px 0 0;font-size:15px;font-weight:600}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#fbf9f5;font-family:'Geist',system-ui,sans-serif;color:#1a140e">

  <header style="padding:54px 20px 0;display:flex;align-items:center;gap:10px">
    <a class="iconbtn" href="Marches.dc.html" aria-label="Retour"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="flex:1"></span>
    <a class="iconbtn" href="AlerteSeuil.dc.html" aria-label="Créer une alerte de cours"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21h4"></path></svg></a>
    <button class="iconbtn" aria-label="{{favLabel}}" aria-pressed="{{favAria}}" onClick="{{toggleFav}}" style="{{favStyle}}"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="{{favFill}}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"></path></svg></button>
  </header>

  <section style="padding:18px 20px 0">
    <div style="display:flex;align-items:center;gap:14px">
      <img src="/_blob/dad075d0e86d2f40aa8c230910e920ed" alt="" style="width:54px;height:54px;border-radius:16px;object-fit:contain;background:#fff;border:1px solid #e8e0d0">
      <div>
        <h1 class="serif" style="margin:0;font-size:24px;font-weight:500">BGFI HC</h1>
        <div style="font-size:12.5px;color:#6b6155;margin-top:2px">BGFI Holding Corporation · Banque</div>
      </div>
    </div>
    <div style="display:flex;align-items:baseline;gap:10px;margin-top:18px">
      <span class="num" style="font-size:40px;font-weight:500;letter-spacing:-0.02em;line-height:1">89 000</span>
      <span style="font-size:14px;color:#6b6155">FCFA</span>
      <span class="num" style="margin-left:auto;font-size:12.5px;padding:4px 10px;border-radius:999px;background:#f4efe5;color:#6b6155">0,00 %</span>
    </div>
    <div style="font-size:12px;color:#8a7f72;margin-top:6px">Clôture du 8 oct. 2026 · Données différées</div>
  </section>

  <section style="margin:16px 20px 0;background:#fff;border:1px solid #e8e0d0;border-radius:22px;padding:14px 14px 10px">
    <svg role="img" aria-label="Évolution du cours sur 6 mois" viewBox="0 0 322 130" style="width:100%;height:130px;display:block">
      <defs><linearGradient id="vg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a23a" stop-opacity="0.28"></stop><stop offset="1" stop-color="#c9a23a" stop-opacity="0"></stop></linearGradient></defs>
      <line x1="0" x2="322" y1="35" y2="35" stroke="#efe8da" stroke-dasharray="3 5"></line>
      <line x1="0" x2="322" y1="75" y2="75" stroke="#efe8da" stroke-dasharray="3 5"></line>
      <line x1="0" x2="322" y1="115" y2="115" stroke="#efe8da" stroke-dasharray="3 5"></line>
      <path d="{{area}}" fill="url(#vg)"></path>
      <path d="{{line}}" fill="none" stroke="#7a4f12" stroke-width="2" stroke-linejoin="round"></path>
      <circle cx="322" cy="{{lastY}}" r="4" fill="#7a4f12" stroke="#fff" stroke-width="2"></circle>
    </svg>
    <div style="display:flex;justify-content:space-between;margin-top:8px">
      <sc-for list="{{periods}}" as="p" hint-placeholder-count="5">
        <button aria-pressed="{{p.aria}}" onClick="{{p.pick}}" style="border:0;font:inherit;font-size:12.5px;padding:6px 13px;border-radius:999px;cursor:pointer;{{p.style}}">{{p.label}}</button>
      </sc-for>
    </div>
  </section>

  <dl style="margin:12px 20px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <div class="stat"><dt>Dernier dividende</dt><dd class="num">2 500 FCFA</dd></div>
    <div class="stat"><dt>Rendement</dt><dd class="num" style="color:#8a6614">2,8 %</dd></div>
    <div class="stat"><dt>Compartiment</dt><dd>A-Premium</dd></div>
    <div class="stat"><dt>Première cotation</dt><dd>7 mai 2026</dd></div>
  </dl>

  <a href="AvisDetail.dc.html" style="margin:12px 20px 0;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#f4efe5;color:#1a140e">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a6614" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path></svg>
    <span style="flex:1;font-size:13px"><span style="font-weight:600">3 avis liés</span> · prospectus et rapports</span>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
  </a>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position:absolute;left:20px;right:20px;bottom:116px;z-index:5;display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;background:#1c130b;color:#fbf6ea;font-size:13.5px;box-shadow:0 16px 40px -12px rgba(28,19,11,0.55)"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ead18a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"></path></svg>{{toast}}</div>
  </sc-if>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 30px;background:#fff;border-top:1px solid #e8e0d0;display:flex;gap:10px">
    <a href="Virtuel.dc.html" style="flex:1;height:52px;border-radius:999px;border:1px solid #d9cdb6;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:#1a140e">Essayer en virtuel</a>
    <a href="Ordre.dc.html" style="flex:1;height:52px;border-radius:999px;background:#1c130b;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;color:#fbf6ea">Investir
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { period: '6M', fav: true, toast: null };
  }
  toast(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: null }), 2500);
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const series = {
      '1S': [62, 60, 61, 58, 59, 57, 58, 56],
      '1M': [70, 66, 68, 62, 64, 60, 61, 58, 59, 56],
      '6M': [96, 92, 94, 80, 84, 70, 74, 60, 66, 58, 62, 50, 56, 52, 60, 54, 58, 55, 56],
      '1A': [110, 104, 100, 96, 98, 88, 84, 86, 76, 70, 72, 64, 60, 62, 56],
      'Tout': [112, 108, 104, 96, 90, 92, 82, 74, 70, 64, 60, 58, 56]
    };
    const ys = series[this.state.period];
    const step = 322 / (ys.length - 1);
    const line = 'M' + ys.map((y, i) => `${Math.round(i * step)} ${y}`).join(' L');
    const fav = this.state.fav;
    return {
      line,
      area: line + ' L322 130 L0 130 Z',
      lastY: ys[ys.length - 1],
      periods: ['1S', '1M', '6M', '1A', 'Tout'].map((label) => {
        const on = label === this.state.period;
        return {
          label,
          aria: on ? 'true' : 'false',
          style: on ? 'background:#1c130b;color:#fbf6ea;font-weight:600;' : 'background:transparent;color:#6b6155;',
          pick: () => this.setState({ period: label })
        };
      }),
      favLabel: fav ? 'Retirer des favoris' : 'Ajouter aux favoris',
      favAria: fav ? 'true' : 'false',
      favFill: fav ? 'currentColor' : 'none',
      favStyle: fav ? 'background:#f4e9c8;border-color:#ead18a;color:#8a6614;' : '',
      toggleFav: () => { this.setState({ fav: !fav }); this.toast(fav ? 'BGFI HC retiré de vos favoris' : 'BGFI HC ajouté à vos favoris'); },
      toast: this.state.toast
    };
  }
}
</script>
</body>
</html>

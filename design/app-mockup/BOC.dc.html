<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Bulletin Officiel de la Cote</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#7a4f12;text-decoration:none}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #efe8da}
.row:last-child{border-bottom:0}
.dl{width:38px;height:38px;border-radius:50%;border:1px solid #e8e0d0;background:#fbf9f5;color:#7a4f12;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
</style>
</helmet>
<div style="width:100%;height:100vh;height:100dvh;position:relative;overflow:hidden;background:#fbf9f5;font-family:'Geist',system-ui,sans-serif;color:#1a140e">
 <div data-lenis-prevent style="position:absolute;inset:0;overflow-y:auto;padding-bottom:30px">
  <header style="padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0;display:flex;align-items:center;gap:12px">
    <a href="Avis.dc.html" aria-label="Retour" style="width:42px;height:42px;border-radius:50%;border:1px solid #e8e0d0;background:#fff;color:#1a140e;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 class="serif" style="margin:0;font-size:22px;font-weight:500">Bulletin Officiel de la Cote</h1>
  </header>

  <section style="margin:16px 20px 0;padding:18px;border-radius:24px;background:#1c130b;color:#efe6d4;position:relative;overflow:hidden">
    <span aria-hidden="true" style="position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,58,0.35),rgba(201,162,58,0) 70%)"></span>
    <div style="font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:0.08em;color:#ead18a;position:relative">BOC08102026 · DERNIÈRE SÉANCE</div>
    <div class="serif" style="font-size:22px;color:#fbf6ea;margin-top:6px;position:relative">Jeudi 8 octobre 2026</div>
    <div style="font-size:12.5px;color:rgba(239,230,212,0.65);margin-top:4px;position:relative">7 actions · 31 lignes obligataires · capitalisation 1 795,9 Md FCFA</div>
    <div style="display:flex;gap:10px;margin-top:16px;position:relative">
      <a href="Document.dc.html" style="flex:1;height:46px;border-radius:999px;background:#c9a23a;color:#1c130b;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600">Lire le BOC</a>
      <button onClick="{{dlLatest}}" style="height:46px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.06);color:#fbf6ea;font:inherit;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>PDF</button>
    </div>
  </section>

  <div style="margin:22px 24px 8px;font-size:11.5px;letter-spacing:0.12em;text-transform:uppercase;color:#8a7f72;font-weight:500">Séances précédentes</div>
  <div style="margin:0 20px;background:#fff;border:1px solid #e8e0d0;border-radius:20px;padding:0 14px">
    <sc-for list="{{items}}" as="b" hint-placeholder-count="6">
      <div class="row">
        <a href="Document.dc.html" style="flex:1;min-width:0;color:#1a140e;display:flex;align-items:center;gap:12px">
          <span style="width:36px;height:42px;border-radius:7px;background:#fbf9f5;border:1px solid #e8e0d0;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#c0263d;flex-shrink:0">PDF</span>
          <span><span style="display:block;font-size:14.5px;font-weight:500">{{b.date}}</span><span style="display:block;font-family:'Geist Mono',monospace;font-size:11px;color:#8a7f72">{{b.ref}}</span></span>
        </a>
        <button class="dl" aria-label="{{b.aria}}" onClick="{{b.dl}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button>
      </div>
    </sc-for>
  </div>
 </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position:absolute;left:20px;right:20px;bottom:34px;z-index:5;display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;background:#1c130b;color:#fbf6ea;font-size:13.5px;box-shadow:0 16px 40px -12px rgba(28,19,11,0.55)"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ead18a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"></path></svg>{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { toast: null };
  }
  toast(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: null }), 2500);
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const sessions = [
      ['Mercredi 7 octobre', 'BOC07102026'], ['Mardi 6 octobre', 'BOC06102026'], ['Lundi 5 octobre', 'BOC05102026'],
      ['Vendredi 2 octobre', 'BOC02102026'], ['Jeudi 1er octobre', 'BOC01102026'], ['Mercredi 30 septembre', 'BOC30092026']
    ];
    return {
      toast: this.state.toast,
      dlLatest: () => this.toast('BOC du 8 octobre téléchargé'),
      items: sessions.map(([date, ref]) => ({
        date, ref,
        aria: 'Télécharger le BOC du ' + date,
        dl: () => this.toast('BOC du ' + date.toLowerCase() + ' téléchargé')
      }))
    };
  }
}
</script>
</body>
</html>

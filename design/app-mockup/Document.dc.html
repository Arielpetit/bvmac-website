<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#ead18a;text-decoration:none}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.tb{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,0.08);color:#fbf6ea;display:flex;align-items:center;justify-content:center;cursor:pointer}

</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#3a332b;font-family:'Geist',system-ui,sans-serif;color:#efe6d4">
  <header style="position:absolute;left:0;right:0;top:0;padding:54px 16px 12px;background:#1c130b;display:flex;align-items:center;gap:10px;z-index:2">
    <a class="tb" href="AvisDetail.dc.html" aria-label="Retour"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:#fbf6ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Décision N°059/2026/BVMAC/DG</div><div style="font-size:11.5px;color:rgba(239,230,212,0.6)">PDF · 2 pages · 184 Ko</div></div>
    <button class="tb" aria-label="Télécharger" onClick="{{download}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button>
    <button class="tb" aria-label="Partager" onClick="{{share}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"></path></svg></button>
  </header>

  <div data-lenis-prevent style="position:absolute;top:120px;left:0;right:0;bottom:0;overflow-y:auto;padding:20px 22px 90px">
    <article aria-label="Page 1" style="background:#fff;border-radius:6px;padding:26px 24px 30px;color:#1a140e;box-shadow:0 20px 40px -18px rgba(0,0,0,0.6)">
      <div style="display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:2px solid #c9a23a">
        <img src="/_blob/4821813fde8f9178dd300928139609f5" alt="" style="width:34px;height:34px">
        <div style="font-size:9px;line-height:1.3;color:#5a3412;font-weight:600;letter-spacing:0.04em">BOURSE DES VALEURS MOBILIÈRES<br>DE L’AFRIQUE CENTRALE</div>
      </div>
      <div style="margin-top:18px;font-size:10px;letter-spacing:0.1em;color:#8a6614;font-weight:600">DÉCISION N°059/2026/BVMAC/DG</div>
      <h1 class="serif" style="margin:6px 0 0;font-size:17px;font-weight:500;line-height:1.3">Introduction en bourse des actions de RENAPROV Finance S.A.</h1>
      <div class="ln" style="margin-top:16px;width:100%"></div><div class="ln" style="width:94%"></div><div class="ln" style="width:97%"></div><div class="ln" style="width:70%"></div>
      <div class="ln" style="margin-top:16px;width:100%"></div><div class="ln" style="width:91%"></div><div class="ln" style="width:96%"></div><div class="ln" style="width:88%"></div><div class="ln" style="width:60%"></div>
      <div class="ln" style="margin-top:16px;width:98%"></div><div class="ln" style="width:85%"></div>
      <div style="margin-top:26px;text-align:right;font-size:10px;color:#6b6155">Fait à Douala, le 3 septembre 2026<br><span style="display:inline-block;margin-top:14px;font-weight:600;color:#1a140e">Le Directeur Général</span></div>
    </article>
    <article aria-label="Page 2" style="margin-top:16px;background:#fff;border-radius:6px;padding:26px 24px;height:200px;box-shadow:0 20px 40px -18px rgba(0,0,0,0.6)">
      <div class="ln" style="width:100%"></div><div class="ln" style="width:92%"></div><div class="ln" style="width:80%"></div>

  </div>

  <div style="position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(28,19,11,0.85);font-size:12.5px;color:#fbf6ea">Page 1 / 2</div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position:absolute;left:20px;right:20px;bottom:76px;z-index:5;display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;background:#fbf9f5;color:#1a140e;font-size:13.5px;box-shadow:0 16px 40px -12px rgba(0,0,0,0.5)"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#157a43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"></path></svg>{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { toast: null };
  }
  toast(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: null }), 2500);
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    return {
      toast: this.state.toast,
      download: () => this.toast('Document enregistré · disponible hors ligne'),
      share: () => this.toast('Lien du document copié')
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Leçon terminée</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#ead18a;text-decoration:none}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.015em}
.st{flex:1;padding:12px;border-radius:16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);text-align:center}
</style>
</helmet>
<div style="width:100%;height:100vh;height:100dvh;position:relative;overflow:hidden;background:#120c06;font-family:'Geist',system-ui,sans-serif;color:#efe6d4">
  <div aria-hidden="true" style="position:absolute;left:50%;top:60px;width:460px;height:460px;margin-left:-230px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,58,0.38),rgba(201,162,58,0) 62%)"></div>
  <a href="Ecole.dc.html" aria-label="Fermer" style="position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:20px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.08);color:#fbf6ea;display:flex;align-items:center;justify-content:center;z-index:2"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>

  <section style="position:relative;padding:calc(82px + env(safe-area-inset-top,0px)) 28px 0;text-align:center">
    <svg role="img" aria-label="Badge Lecteur du BOC" width="148" height="160" viewBox="0 0 148 160" style="margin:0 auto;display:block">
      <path d="M50 112 38 158l36-18 36 18-12-46" fill="#8a6614"></path>
      <circle cx="74" cy="70" r="62" fill="#c9a23a"></circle>
      <circle cx="74" cy="70" r="52" fill="none" stroke="#ead18a" stroke-width="2" stroke-dasharray="4 5"></circle>
      <circle cx="74" cy="70" r="40" fill="#1c130b"></circle>
      <path d="M62 52h17l9 9v27H62z" fill="none" stroke="#ead18a" stroke-width="3" stroke-linejoin="round"></path>
      <path d="M79 52v9h9M67 70h16M67 78h11" stroke="#ead18a" stroke-width="3" stroke-linecap="round"></path>
    </svg>
    <div style="margin-top:18px;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#ead18a">Nouveau badge</div>
    <h1 class="serif" style="margin:8px 0 0;font-size:32px;font-weight:500;color:#fbf6ea">Lecteur du BOC</h1>
    <p style="margin:10px auto 0;max-width:290px;font-size:14.5px;line-height:1.55;color:rgba(239,230,212,0.72)">Vous savez lire une ligne du Bulletin Officiel de la Cote. Bravo, Aminata !</p>
    <div style="margin-top:24px;display:flex;gap:10px">
      <div class="st"><div class="serif" style="font-size:22px;color:#fbf6ea">4/5</div><div style="font-size:11.5px;color:rgba(239,230,212,0.6)">Bonnes réponses</div></div>
      <div class="st"><div class="serif" style="font-size:22px;color:#fbf6ea">+40</div><div style="font-size:11.5px;color:rgba(239,230,212,0.6)">XP</div></div>
      <div class="st"><div class="serif" style="font-size:22px;color:#fbf6ea">5 j</div><div style="font-size:11.5px;color:rgba(239,230,212,0.6)">Série</div></div>
    </div>
  </section>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position:absolute;left:20px;right:20px;bottom:170px;z-index:5;display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;background:#fbf9f5;color:#1a140e;font-size:13.5px"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#157a43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"></path></svg>{{toast}}</div>
  </sc-if>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:0 24px 34px">
    <a href="Parcours.dc.html" style="height:56px;border-radius:999px;background:#c9a23a;color:#1c130b;display:flex;align-items:center;justify-content:center;font-size:15.5px;font-weight:600">Leçon suivante</a>
    <button onClick="{{share}}" style="width:100%;margin-top:8px;height:48px;border:0;background:transparent;font:inherit;font-size:14.5px;color:#efe6d4;cursor:pointer">Partager mon badge</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { toast: null };
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    return {
      toast: this.state.toast,
      share: () => {
        this.setState({ toast: 'Badge prêt à être partagé' });
        clearTimeout(this._t);
        this._t = setTimeout(() => this.setState({ toast: null }), 2500);
      }
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Confirmer avec votre PIN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#7a4f12;text-decoration:none}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.num{font-variant-numeric:tabular-nums}
.key{height:58px;border:0;border-radius:18px;background:transparent;font:inherit;font-size:25px;color:#1a140e;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#2a2219;font-family:'Geist',system-ui,sans-serif;color:#1a140e">
  <a href="Ordre.dc.html" aria-label="Annuler" style="position:absolute;inset:0;background:rgba(18,12,6,0.55)"></a>
  <section role="dialog" aria-modal="true" aria-labelledby="pin-t" style="position:absolute;left:0;right:0;bottom:0;background:#fbf9f5;border-radius:28px 28px 0 0;padding:12px 24px 30px">
    <div style="width:40px;height:5px;border-radius:999px;background:#d9cdb6;margin:0 auto 16px"></div>
    <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid #e8e0d0">
      <img src="/_blob/dad075d0e86d2f40aa8c230910e920ed" alt="" style="width:36px;height:36px;border-radius:10px;object-fit:contain;border:1px solid #efe8da">
      <span style="flex:1"><span style="display:block;font-size:14px;font-weight:600">Achat · 10 BGFI HC</span><span class="num" style="display:block;font-size:12px;color:#6b6155">Limite 89 000 · jour · EDC Investment</span></span>
      <span class="num" style="font-size:14px;font-weight:600">≈ 900 680</span>
    </div>

    <h2 id="pin-t" class="serif" style="margin:20px 0 0;text-align:center;font-size:21px;font-weight:500">{{title}}</h2>
    <div aria-label="{{progress}}" style="margin:16px 0 0;display:flex;justify-content:center;gap:14px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="6"><span class="dot" style="{{d}}"></span></sc-for>
    </div>

    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <a href="OrdreConfirme.dc.html" style="margin-top:24px;height:54px;border-radius:999px;background:#1c130b;color:#fbf6ea;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600">Transmettre l’ordre</a>
    </sc-if>
    <sc-if value="{{typing}}" hint-placeholder-val="{{true}}">
      <div role="group" aria-label="Clavier" style="margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <button class="key" aria-label="{{k.aria}}" onClick="{{k.press}}">{{k.label}}</button>
        </sc-for>
      </div>
      <button onClick="{{bio}}" style="margin:6px auto 0;display:flex;align-items:center;gap:8px;border:0;background:transparent;font:inherit;font-size:13.5px;color:#7a4f12;cursor:pointer;padding:8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11v3M8 9a4 4 0 0 1 8 0v5a8 8 0 0 1-1 4M6 12v2a10 10 0 0 0 1.5 5.5M18 8.5A6 6 0 0 0 6.5 7M12 3a8 8 0 0 1 8 8v2"></path></svg>Utiliser l’empreinte
      </button>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pin: '' };
  }
  renderVals() {
    const pin = this.state.pin;
    const done = pin.length === 6;
    const press = (d) => () => { if (this.state.pin.length < 6) this.setState({ pin: this.state.pin + d }); };
    return {
      done, typing: !done,
      title: done ? 'Identité confirmée' : 'Confirmez avec votre code PIN',
      progress: pin.length + ' chiffres sur 6',
      dots: [0, 1, 2, 3, 4, 5].map((i) => done ? 'background:#157a43;' : (i < pin.length ? 'background:#1c130b;' : 'background:transparent;border:2px solid #d9cdb6;box-sizing:border-box;')),
      bio: () => this.setState({ pin: '000000' }),
      keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((k) => ({
        label: k,
        aria: k === '⌫' ? 'Effacer' : (k || 'vide'),
        press: k === '⌫' ? () => this.setState({ pin: this.state.pin.slice(0, -1) }) : (k ? press(k) : () => {})
      }))
    };
  }
}
</script>
</body>
</html>

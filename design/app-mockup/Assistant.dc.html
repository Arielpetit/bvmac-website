<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Assistant Bémac</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#7a4f12;text-decoration:none}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.bot{max-width:82%;padding:11px 14px;border-radius:18px 18px 18px 6px;background:#fff;border:1px solid #e8e0d0;font-size:14px;line-height:1.5}
.me{max-width:78%;margin-left:auto;padding:11px 14px;border-radius:18px 18px 6px 18px;background:#1c130b;color:#fbf6ea;font-size:14px;line-height:1.5}
.sug{height:34px;padding:0 13px;border-radius:999px;border:1px solid #e8e0d0;background:#fff;font:inherit;font-size:12.5px;color:#1a140e;white-space:nowrap;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#fbf9f5;font-family:'Geist',system-ui,sans-serif;color:#1a140e">
  <header style="background:#1c130b;color:#efe6d4;padding:54px 16px 14px;display:flex;align-items:center;gap:12px">
    <a href="APropos.dc.html" aria-label="Retour" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.08);color:#fbf6ea;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="position:relative"><img src="/_blob/4821813fde8f9178dd300928139609f5" alt="" style="width:42px;height:42px"><span style="position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 2px #1c130b"></span></span>
    <div style="flex:1"><div class="serif" style="font-size:19px;color:#fbf6ea">Bémac</div><div style="font-size:12px;color:rgba(239,230,212,0.65)">Assistant BVMAC · en ligne</div></div>
  </header>

  <div data-lenis-prevent style="position:absolute;top:122px;left:0;right:0;bottom:150px;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px">
    <div class="bot">Bonjour Aminata. Posez-moi une question sur le marché, une valeur ou une notion de bourse.</div>
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="2">
      <div class="{{m.cls}}">{{m.text}}</div>
      <sc-if value="{{m.card}}" hint-placeholder-val="{{false}}">
        <a href="Valeur.dc.html" style="max-width:82%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid #e8e0d0;color:#1a140e">
          <img src="/_blob/dad075d0e86d2f40aa8c230910e920ed" alt="" style="width:34px;height:34px;border-radius:9px;object-fit:contain;border:1px solid #efe8da">
          <span style="flex:1"><span style="display:block;font-weight:600;font-size:13.5px">BGFI HC</span><span style="display:block;font-size:11.5px;color:#6b6155">Voir la fiche</span></span>
          <span style="font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums">89 000</span>
        </a>
      </sc-if>
    </sc-for>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;background:#fbf9f5;border-top:1px solid #e8e0d0;padding:10px 16px 28px">
    <div role="group" aria-label="Suggestions" style="display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px">
      <sc-for list="{{sugs}}" as="s" hint-placeholder-count="3"><button class="sug" onClick="{{s.ask}}">{{s.label}}</button></sc-for>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-radius:999px;background:#fff;border:1px solid #e8e0d0">
      <label style="flex:1"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Votre question</span><input value="{{draft}}" onChange="{{onType}}" placeholder="Votre question…" style="width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:14.5px;color:#1a140e"></label>
      <button aria-label="Envoyer" onClick="{{send}}" style="width:40px;height:40px;border-radius:50%;border:0;background:#c9a23a;color:#1c130b;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
    </div>
    <p style="margin:8px 0 0;text-align:center;font-size:10.5px;color:#8a7f72">Réponses générées par IA à partir des contenus BVMAC · informations indicatives</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      msgs: [
        { cls: 'me', text: 'Quel est le cours de BGFI ?' },
        { cls: 'bot', text: 'BGFI HC a clôturé à 89 000 FCFA le 8 octobre 2026 (0,00 %). Données différées.', card: true }
      ]
    };
  }
  ask(q) {
    const answers = {
      'Qu’est-ce qu’un dividende ?': 'C’est la part du bénéfice qu’une société verse à ses actionnaires, en général une fois par an. Exemple : SOCAPALM a versé 2 325 FCFA par action en juillet.',
      'Comment investir ?': 'Ouvrez un compte-titres auprès d’une société de bourse agréée par la COSUMAF. Vous pouvez le faire depuis Compte › Ouvrir un compte-titres.',
      'Prochain BOC ?': 'Le Bulletin Officiel de la Cote est publié après chaque séance. Activez l’alerte « BOC publié » pour être prévenu.'
    };
    const reply = answers[q] || 'Je cherche dans les contenus officiels de la BVMAC… Pour cette maquette, essayez une des suggestions.';
    this.setState({ draft: '', msgs: [...this.state.msgs, { cls: 'me', text: q }, { cls: 'bot', text: reply }] });
  }
  renderVals() {
    return {
      draft: this.state.draft,
      msgs: this.state.msgs.map((m) => ({ ...m, card: !!m.card })),
      onType: (e) => this.setState({ draft: e.target.value }),
      send: () => { if (this.state.draft.trim()) this.ask(this.state.draft.trim()); },
      sugs: ['Qu’est-ce qu’un dividende ?', 'Comment investir ?', 'Prochain BOC ?'].map((label) => ({ label, ask: () => this.ask(label) }))
    };
  }
}
</script>
</body>
</html>

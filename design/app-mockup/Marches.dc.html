<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BVMAC – Marchés</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#7a4f12;text-decoration:none}a:hover{color:#5a3412}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.01em}
.num{font-variant-numeric:tabular-nums}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:#8a7f72;text-decoration:none}
.tab.on{color:#1c130b;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #efe8da;color:#1a140e}
.logo{width:40px;height:40px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid #efe8da;flex-shrink:0}
.chg{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#f4efe5;color:#6b6155}
.chip{height:32px;padding:0 14px;border-radius:999px;font:inherit;font-size:12.5px;white-space:nowrap;cursor:pointer}
</style>
</helmet>
<div style="width:100%;height:100vh;height:100dvh;position:relative;overflow:hidden;background:#fbf9f5;font-family:'Geist',system-ui,sans-serif;color:#1a140e">
 <div data-lenis-prevent style="position:absolute;top:0;left:0;right:0;bottom:84px;overflow-y:auto;padding-bottom:24px">

  <header style="padding:calc(18px + env(safe-area-inset-top,0px)) 20px 0">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h1 class="serif" style="margin:0;font-size:30px;font-weight:500">Marchés</h1>
      <span style="display:inline-flex;align-items:center;gap:6px;background:#e4f3ea;color:#157a43;font-size:11.5px;font-weight:500;padding:5px 10px;border-radius:999px"><span style="width:6px;height:6px;border-radius:50%;background:#157a43"></span>Séance ouverte</span>
    </div>
    <a href="Recherche.dc.html" style="margin-top:14px;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;background:#fff;border:1px solid #e8e0d0;border-radius:999px;color:#8a7f72;font-size:14px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a6614" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      Valeur, émetteur, ISIN…
    </a>
    <div role="tablist" aria-label="Rubrique" style="margin-top:14px;display:flex;background:#f4efe5;border-radius:999px;padding:4px">
      <span role="tab" aria-selected="true" style="flex:1;height:36px;border-radius:999px;background:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(32,20,8,0.12)">Actions · 7</span>
      <a href="Obligations.dc.html" role="tab" aria-selected="false" style="flex:1;height:36px;border-radius:999px;font-size:13px;color:#6b6155;display:flex;align-items:center;justify-content:center">Obligations · 31</a>
      <a href="Avis.dc.html" role="tab" aria-selected="false" style="flex:1;height:36px;border-radius:999px;font-size:13px;color:#6b6155;display:flex;align-items:center;justify-content:center">Avis</a>
    </div>
    <div role="group" aria-label="Filtrer par pays" style="margin-top:12px;display:flex;gap:8px;overflow:hidden">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button class="chip" aria-pressed="{{c.aria}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </header>

  <section style="padding:12px 20px 0">
    <div style="display:flex;justify-content:space-between;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#8a7f72;padding:6px 0">
      <span>Valeur</span><span>Cours (FCFA) · Var.</span>
    </div>
    <div style="background:#fff;border:1px solid #e8e0d0;border-radius:20px;padding:0 14px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <a class="row" href="Valeur.dc.html" style="{{r.last}}"><img class="logo" src="{{r.logo}}" alt=""><span style="flex:1"><span style="display:block;font-weight:600;font-size:14.5px">{{r.name}}</span><span style="display:block;font-size:12px;color:#6b6155">{{r.sector}} · {{r.country}}</span></span><span style="text-align:right"><span class="num" style="display:block;font-weight:600;font-size:15px">{{r.price}}</span><span class="chg num">0,00 %</span></span></a>
      </sc-for>
    </div>
  </section>
 </div>

  <nav aria-label="Navigation principale" style="position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(255,255,255,0.96);border-top:1px solid #e8e0d0;display:flex;padding:10px 8px 0">
    <a class="tab" href="Main.dc.html"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Accueil</a>
    <a class="tab on" href="Marches.dc.html" aria-current="page"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="m7 15 4-4 3 3 5-6"></path></svg>Marchés</a>
    <a class="tab" href="Portefeuille.dc.html" style="color:#1c130b;font-weight:500"><span style="width:52px;height:52px;margin-top:-26px;border-radius:50%;background:#c9a23a;color:#1c130b;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -8px rgba(138,102,20,0.6),0 0 0 5px #fbf9f5"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg></span>Portefeuille</a>
    <a class="tab" href="Ecole.dc.html"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"></path><path d="M6 12v5c3 2 9 2 12 0v-5"></path></svg>École</a>
    <a class="tab" href="Moi.dc.html"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>Compte</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { country: '' };
  }
  renderVals() {
    const all = [
      { name: 'BGFI HC', sector: 'Banque', country: 'Gabon', price: '89 000', logo: './assets/dad075d0e86d2f40aa8c230910e920ed.png' },
      { name: 'BANGE', sector: 'Banque', country: 'Guinée éq.', price: '228 085', logo: './assets/b458ecaefb92226c22f38ba2b544b23f.png' },
      { name: 'SEMC', sector: 'Boissons', country: 'Cameroun', price: '53 000', logo: './assets/5db7833cc651236a156346fb03a776ce.png' },
      { name: 'SOCAPALM', sector: 'Agro-industrie', country: 'Cameroun', price: '49 500', logo: './assets/d99733952378c2f0b677faef5b0f9f3a.png' },
      { name: 'SAFACAM', sector: 'Agro-industrie', country: 'Cameroun', price: '38 500', logo: './assets/5d754d569f2a9eb85783b50b38e4ff00.png' },
      { name: 'La Régionale', sector: 'Microfinance', country: 'Cameroun', price: '38 000', logo: './assets/e2a82fbfd1ed1a49495e5a9ba8a5b891.png' },
      { name: 'SCG-Ré', sector: 'Réassurance', country: 'Gabon', price: '20 000', logo: './assets/7ef65fcd5636225925680793a7130b18.png' }
    ];
    const sel = this.state.country;
    const rows = all.filter((r) => !sel || r.country === sel);
    const opts = [['', 'Tous les pays'], ['Cameroun', 'Cameroun · 4'], ['Gabon', 'Gabon · 2'], ['Guinée éq.', 'Guinée éq. · 1']];
    return {
      rows: rows.map((r, i) => ({ ...r, last: i === rows.length - 1 ? 'border-bottom:0' : '' })),
      chips: opts.map(([v, label]) => ({
        label,
        aria: v === sel ? 'true' : 'false',
        style: v === sel ? 'border:1px solid #1c130b;background:#1c130b;color:#fbf6ea;' : 'border:1px solid #e8e0d0;background:#fff;color:#1a140e;',
        pick: () => this.setState({ country: v })
      }))
    };
  }
}
</script>
</body>
</html>
